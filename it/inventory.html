<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classical IT — Master Inventory</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="landing" class="landing">
    <div class="landing-card">
        <h1>Classical IT</h1>
        <p>Sign in with your school Google account to continue.</p>
        <button class="btn btn-primary" id="authorize_button" onclick="handleAuthClick()" disabled>Sign In with Google</button>
        <p class="landing-status" id="landing_status">Loading&hellip;</p>
    </div>
</div>

<div id="game-ui" style="display:none">
    <nav class="nav">
        <a class="nav-brand" href="./">Classical IT</a>
        <div class="nav-links">
            <a href="createticket.html">Create Ticket</a>
            <a href="ticketqueue.html">Ticket Queue</a>
            <a href="devicestatus.html">Student Device Status</a>
            <a href="inventory.html" class="active">Master Inventory</a>
            <a href="admin.html" id="nav-admin-link" class="nav-admin" style="display:none">Admin</a>
            <span class="nav-user-email" id="user-email"></span>
            <button class="nav-signin-btn" id="signout_button" onclick="handleSignoutClick()" style="display:none">Sign Out</button>
        </div>
    </nav>

    <div class="page-content">
        <div id="not-staff" style="display:none">
            <h1>Master Inventory</h1>
            <p>This page is only available to staff accounts.</p>
        </div>

        <div id="inventory-content" style="display:none">
            <h1>Master Inventory</h1>
            <input type="text" class="search-input" id="search" placeholder="Search by name, advisor, serial, or asset #" oninput="onSearchInput()">
            <button class="btn btn-primary" onclick="downloadCsv()">Download CSV</button>

            <div class="tabs" id="inventory-tabs"></div>
            <div id="section-staff"></div>
            <div id="section-student"></div>
            <div id="section-cart"></div>
            <div id="section-unassigned"></div>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
    let assets = [];
    let activeTab = 'staff';
    const sortState = {}; // { [sectionName]: { col, dir } }

    // ── Column definitions per section ──────────────────────────────────

    const SECTIONS = {
        staff: {
            title: 'Staff Devices',
            data: () => assets.filter(a => a.assigned_type === 'staff'),
            columns: [
                { key: 'owner', label: 'Assigned To', value: a => personName(a) },
                { key: 'serial_number', label: 'Serial', value: a => a.serial_number },
                { key: 'asset_number', label: 'Asset #', value: a => a.asset_number || '' },
                { key: 'device_status', label: 'Status', value: a => a.device_status, render: a => statusPill(a.device_status) },
                { key: 'repair_status', label: 'Repair Status', value: a => a.repair_status || '', render: a => statusLabel(a.repair_status) },
            ],
        },
        student: {
            title: 'Student Devices',
            data: () => assets.filter(a => a.assigned_type === 'student'),
            columns: [
                { key: 'owner', label: 'Assigned To', value: a => personName(a) },
                { key: 'grade_level', label: 'Grade', value: a => a.grade_level || '' },
                { key: 'advisor_name', label: 'Advisor', value: a => a.advisor_name || '' },
                { key: 'serial_number', label: 'Serial', value: a => a.serial_number },
                { key: 'asset_number', label: 'Asset #', value: a => a.asset_number || '' },
                { key: 'device_status', label: 'Status', value: a => a.device_status, render: a => statusPill(a.device_status) },
                { key: 'repair_status', label: 'Repair Status', value: a => a.repair_status || '', render: a => statusLabel(a.repair_status) },
            ],
        },
        cart: {
            title: 'Cart Devices',
            data: () => withCartLabels(assets.filter(a => a.assigned_type === 'cart')),
            columns: [
                { key: 'cart_label', label: 'Assigned To', value: a => a.cart_label },
                { key: 'serial_number', label: 'Serial', value: a => a.serial_number },
                { key: 'asset_number', label: 'Asset #', value: a => a.asset_number || '' },
                { key: 'device_status', label: 'Status', value: a => a.device_status, render: a => statusPill(a.device_status) },
                { key: 'repair_status', label: 'Repair Status', value: a => a.repair_status || '', render: a => statusLabel(a.repair_status) },
            ],
        },
        unassigned: {
            title: 'Unassigned Devices',
            data: () => assets.filter(a => !a.assigned_type),
            columns: [
                { key: 'serial_number', label: 'Serial', value: a => a.serial_number },
                { key: 'asset_number', label: 'Asset #', value: a => a.asset_number || '' },
                { key: 'device_status', label: 'Status', value: a => a.device_status, render: a => statusPill(a.device_status) },
                { key: 'repair_status', label: 'Repair Status', value: a => a.repair_status || '', render: a => statusLabel(a.repair_status) },
            ],
        },
    };

    function personName(a) {
        return a.person_first_name ? `${a.person_first_name} ${a.person_last_name}` : '(unassigned)';
    }

    function statusLabel(s) {
        return s ? s.replace(/\b\w/g, c => c.toUpperCase()) : '';
    }

    function statusPill(status) {
        return `<span class="status-pill status-${status.replace(/\s+/g, '-')}">${statusLabel(status)}</span>`;
    }

    // Cart devices carry no individual identity of their own, so within each cart
    // (grouped by assigned_cart_name) they're numbered by import order — assumed to
    // already be in the correct physical/progressing order — e.g. MS-SCI-01, MS-SCI-02.
    function withCartLabels(cartAssets) {
        const counts = {};
        return [...cartAssets].sort((a, b) => a.id - b.id).map(a => {
            const name = a.assigned_cart_name || 'Cart';
            counts[name] = (counts[name] || 0) + 1;
            return { ...a, cart_label: `${name}-${String(counts[name]).padStart(2, '0')}` };
        });
    }

    function searchHaystack(a) {
        return [personName(a), a.cart_label, a.assigned_cart_name, a.advisor_name, a.serial_number, a.asset_number]
            .filter(Boolean).join(' ').toLowerCase();
    }

    function alphaNumericCompare(a, b) {
        return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
    }

    function sortColumn(sectionName, colKey) {
        const state = sortState[sectionName] || {};
        state.dir = state.col === colKey && state.dir === 'asc' ? 'desc' : 'asc';
        state.col = colKey;
        sortState[sectionName] = state;
        renderSection(sectionName);
    }

    // Tabs: only offer a tab for a group that actually has devices (Unassigned is
    // usually empty and shouldn't clutter the bar). Computed once from the full,
    // unfiltered data so typing in search doesn't make tabs appear/disappear.
    function renderTabs() {
        const visible = Object.keys(SECTIONS).filter(name => name !== 'unassigned' || SECTIONS.unassigned.data().length > 0);
        if (!visible.includes(activeTab)) activeTab = visible[0];

        document.getElementById('inventory-tabs').innerHTML = visible.map(name =>
            `<button class="tab ${name === activeTab ? 'active' : ''}" onclick="switchTab('${name}')">${SECTIONS[name].title}</button>`
        ).join('');

        visible.forEach(name => {
            document.getElementById('section-' + name).style.display = name === activeTab ? '' : 'none';
        });
    }

    function switchTab(name) {
        activeTab = name;
        renderTabs();
        renderSection(name);
    }

    function onSearchInput() {
        renderSection(activeTab);
    }

    function renderSection(name) {
        const config    = SECTIONS[name];
        const container = document.getElementById('section-' + name);
        const q         = document.getElementById('search').value.trim().toLowerCase();

        let rows = config.data().filter(a => !q || searchHaystack(a).includes(q));

        const state = sortState[name];
        if (state && state.col) {
            const col = config.columns.find(c => c.key === state.col);
            rows = [...rows].sort((a, b) => {
                const cmp = alphaNumericCompare(col.value(a), col.value(b));
                return state.dir === 'desc' ? -cmp : cmp;
            });
        }

        const headCells = config.columns.map(c => {
            const arrow = state && state.col === c.key ? (state.dir === 'desc' ? ' ↓' : ' ↑') : '';
            return `<th onclick="sortColumn('${name}','${c.key}')" style="cursor:pointer">${c.label}${arrow}</th>`;
        }).join('');

        const bodyRows = rows.map(a => `<tr>${config.columns.map(c => `<td>${c.render ? c.render(a) : c.value(a)}</td>`).join('')}</tr>`).join('')
            || `<tr><td colspan="${config.columns.length}">No devices.</td></tr>`;

        container.innerHTML = `
            <table class="data-table">
                <thead><tr>${headCells}</tr></thead>
                <tbody>${bodyRows}</tbody>
            </table>
        `;
    }

    function csvEsc(v) {
        const s = String(v == null ? '' : v);
        return (s.includes(',') || s.includes('"')) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function downloadCsv() {
        const rows = [
            ...SECTIONS.staff.data().map(a => ({ assigned_to: personName(a), grade_level: '', advisor_name: '', ...a })),
            ...SECTIONS.student.data().map(a => ({ assigned_to: personName(a), ...a })),
            ...SECTIONS.cart.data().map(a => ({ assigned_to: a.cart_label, grade_level: '', advisor_name: '', ...a })),
            ...SECTIONS.unassigned.data().map(a => ({ assigned_to: '(unassigned)', grade_level: '', advisor_name: '', ...a })),
        ];
        const header = ['assigned_to', 'grade_level', 'advisor_name', 'serial_number', 'asset_number', 'device_status', 'repair_status'];
        const lines  = [header.join(',')].concat(rows.map(r => [
            r.assigned_to, r.grade_level || '', r.advisor_name || '', r.serial_number,
            r.asset_number || '', r.device_status, r.repair_status || '',
        ].map(csvEsc).join(',')));
        const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href     = URL.createObjectURL(blob);
        link.download = 'master-inventory.csv';
        link.click();
    }

    async function onSignedIn() {
        document.getElementById('signout_button').style.display = '';
        const me = await authFetch('/api/it/me').then(r => r.json());
        document.getElementById('user-email').textContent = me.email || '';
        if (me.isAdmin) document.getElementById('nav-admin-link').style.display = '';
        if (!me.isStaff) { document.getElementById('not-staff').style.display = ''; return; }

        document.getElementById('inventory-content').style.display = '';
        const data = await authFetch('/api/it/assets').then(r => r.json());
        assets = data.assets;
        renderTabs();
        renderSection(activeTab);
    }
</script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
