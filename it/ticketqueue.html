<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classical IT — Ticket Queue</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="landing" class="landing">
    <div class="landing-card">
        <h1>Classical IT</h1>
        <p>Sign in with your school Google account to continue.</p>
        <button class="btn btn-primary" id="authorize_button" onclick="handleAuthClick()" disabled>Sign In with Google</button>
        <p class="landing-status" id="landing_status">Loading&hellip;</p>
    </div>
</div>

<div id="game-ui" style="display:none">
    <nav class="nav">
        <a class="nav-brand" href="./">Classical IT</a>
        <div class="nav-links">
            <a href="createticket.html">Create Ticket</a>
            <a href="ticketqueue.html" class="active">Ticket Queue</a>
            <a href="devicestatus.html" id="nav-devicestatus-link" style="display:none">Student Device Status</a>
            <a href="inventory.html" id="nav-inventory-link" style="display:none">Master Inventory</a>
            <a href="admin.html" id="nav-admin-link" class="nav-admin" style="display:none">Admin</a>
            <span class="nav-user-email" id="user-email"></span>
            <button class="nav-signin-btn" id="signout_button" onclick="handleSignoutClick()" style="display:none">Sign Out</button>
        </div>
    </nav>

    <div class="page-content">
        <h1 id="queue-title">My Ticket Queue</h1>
        <table class="data-table">
            <thead>
                <tr><th>Ticket #</th><th>Date</th><th>Category</th><th>Priority</th><th>Status</th><th>Note</th><th></th></tr>
            </thead>
            <tbody id="ticket-rows"></tbody>
        </table>
        <button class="btn btn-primary" id="show-all-btn" onclick="showAllTickets()">Show All</button>
    </div>
</div>

<div id="ticket-modal" class="modal-backdrop" style="display:none" onclick="if(event.target===this) closeTicketModal()">
    <div class="modal-card">
        <div id="ticket-modal-body">Loading&hellip;</div>
        <button class="btn btn-primary" onclick="closeTicketModal()">Close</button>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
    function ticketNumber(id) {
        return String(id).padStart(4, '0');
    }

    function renderTickets(tickets) {
        document.getElementById('ticket-rows').innerHTML = tickets.map(t => `
            <tr>
                <td>#${ticketNumber(t.id)}</td>
                <td>${new Date(t.created_at).toLocaleDateString()}</td>
                <td>${t.category}</td>
                <td>${t.priority}</td>
                <td class="text-center"><span class="status-pill status-${t.status.toLowerCase().replace(/\s+/g, '-')}">${t.status}</span></td>
                <td>${t.note || ''}</td>
                <td><button class="icon-btn" title="View history" onclick="openTicketModal(${t.id})">📝</button></td>
            </tr>
        `).join('') || '<tr><td colspan="7">No tickets yet.</td></tr>';
    }

    async function openTicketModal(ticketId) {
        const modal = document.getElementById('ticket-modal');
        const body  = document.getElementById('ticket-modal-body');
        modal.style.display = 'flex';
        body.innerHTML = 'Loading&hellip;';
        const data = await authFetch(`/api/it/tickets/${ticketId}`).then(r => r.json());
        if (!data.ticket) { body.innerHTML = 'Ticket not found.'; return; }
        const t = data.ticket;
        body.innerHTML = `
            <h2>Ticket #${ticketNumber(t.id)}</h2>
            <p><strong>Received:</strong> ${new Date(t.created_at).toLocaleString()}</p>
            <p><strong>Status:</strong> ${t.status}</p>
            <p><strong>Category:</strong> ${t.category} &mdash; <strong>Priority:</strong> ${t.priority}</p>
            ${t.asset_serial_number ? `<p><strong>Asset:</strong> Serial ${t.asset_serial_number}${t.asset_asset_number ? ` (Asset #${t.asset_asset_number})` : ''}</p>` : ''}
            <p>${t.note || ''}</p>
            <h3>History</h3>
            ${data.events.map(e => `
                <div class="event-log-item">
                    <div class="event-meta">${new Date(e.created_at).toLocaleString()} &mdash; ${e.actor_email}</div>
                    <div>${e.detail}</div>
                </div>
            `).join('') || '<p>No history yet.</p>'}
        `;
    }

    function closeTicketModal() {
        document.getElementById('ticket-modal').style.display = 'none';
    }

    async function loadTickets(all) {
        const data = await authFetch(`/api/it/tickets/mine${all ? '?all=1' : ''}`).then(r => r.json());
        renderTickets(data.tickets);
    }

    function showAllTickets() {
        document.getElementById('show-all-btn').style.display = 'none';
        document.getElementById('queue-title').textContent = 'Ticket Queue';
        loadTickets(true);
    }

    async function onSignedIn() {
        document.getElementById('signout_button').style.display = '';
        const me = await authFetch('/api/it/me').then(r => r.json());
        document.getElementById('user-email').textContent = me.email || '';
        if (me.isStaff) {
            document.getElementById('nav-devicestatus-link').style.display = '';
            document.getElementById('nav-inventory-link').style.display = '';
        }
        if (me.isAdmin) document.getElementById('nav-admin-link').style.display = '';
        loadTickets(false);
    }
</script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
